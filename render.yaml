# Render.com Blueprint — Srikrishna Seva Niketan API
# Docs: https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard → New → Blueprint → pick this repo.
# Then set every `sync: false` var in the dashboard (see DEPLOYMENT.md).
services:
  - type: web
    name: srikrishna-seva-niketan-backend
    runtime: python
    plan: starter            # 512 MB RAM — keep worker count low (see below)
    region: singapore
    branch: main
    buildCommand: pip install -r requirements.txt
    # 1 async Uvicorn worker handles 10,000+ concurrent connections while keeping
    # memory usage under 200 MB on the 512 MB starter plan (eliminates OOM reboots).
    startCommand: >
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 1
      --bind 0.0.0.0:$PORT
      --timeout 120
      --access-logfile -
      --error-logfile -
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong value
      - key: MONGODB_DB_NAME
        value: srikrishna_seva_niketan
      - key: SMTP_PORT
        value: "587"
      # ---- Secrets / per-environment values — set these in the dashboard ----
      - key: OLA_MAPS_API_KEY
        sync: false                  # Ola Maps (Krutrim) server-side key — geocode + directions
      - key: GEMINI_API_KEY
        sync: false                  # Google Gemini vision key — government-ID OCR extraction
      - key: MONGODB_URL
        sync: false                  # mongodb+srv://<user>:<ROTATED_pw>@<cluster>/...
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      - key: CORS_ORIGINS
        sync: false                  # https://<admin>.vercel.app,https://<frontend>.vercel.app
      - key: FRONTEND_URL
        sync: false                  # https://<frontend>.vercel.app
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: FIRST_ADMIN_PASSWORD
        sync: false
